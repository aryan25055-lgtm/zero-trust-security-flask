{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card p-4">
    <h2 class="fw-bold">Sign in</h2><p class="muted">Step 1: verify your account credentials.</p>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label class="form-label">Username</label>
      <input class="form-control mb-3" name="username" required autocomplete="username">
      <label class="form-label">Password</label>
      <input class="form-control mb-3" type="password" name="password" required autocomplete="current-password">
      <button class="btn btn-primary w-100">Continue to MFA</button>
    </form>
    <hr><p class="small muted mb-0">Demo: <code>admin</code> / <code>Admin@12345</code> or <code>employee</code> / <code>Employee@12345</code>.</p>
  </div>
</div></div>
{% endblock %}
