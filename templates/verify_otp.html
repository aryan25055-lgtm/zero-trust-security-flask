{% extends "base.html" %}
{% block title %}MFA verification{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card p-4">
    <h2 class="fw-bold">Second-factor verification</h2>
    <p class="muted">Step 2: enter the six-digit code printed in the terminal running Flask. The code expires after five minutes.</p>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label class="form-label">One-time code</label>
      <input class="form-control form-control-lg text-center mb-3" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="trust_device" value="yes" id="trust"><label class="form-check-label" for="trust">Trust this browser for 30 days</label></div>
      <button class="btn btn-primary w-100">Verify and sign in</button>
    </form>
  </div>
</div></div>
{% endblock %}
